name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests -v
      - name: Ruff
        run: ruff check . --select E4,E7,E9,F
      - name: Design contract
        run: python scripts/check_design.py
      - name: Verify no committed runtime logs or env files
        run: |
          test -z "$(git ls-files '.env' 'logs/*.log')"